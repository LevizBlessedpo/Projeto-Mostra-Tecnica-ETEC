<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Seja bem-vindo ao nosso chat</title>
    <link rel="stylesheet" href="chat.css">
</head>
<body>
    <div class="chat-container">
        <h1>Chat com a IA</h1>
        
        <!-- Área onde as mensagens do Usuário e da IA vão aparecer -->
        <div class="chat-box" id="chat-box"></div>
        
        <!-- Área de digitação e envio -->
        <div class="chat-input-container">
            <input type="text" id="user-input" placeholder="Digite sua mensagem..." autocomplete="off">
            <button id="send-button">Enviar</button>
        </div>
    </div>

    <!-- Importação do arquivo JavaScript compilado pelo TypeScript -->
    <script type="module" src="./dist/chat.js"></script>
</body>
</html>
